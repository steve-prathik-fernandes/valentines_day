<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Valentine</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ffe6eb 0%, #ffccdd 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .background-decoration {
      position: fixed;
      font-size: 4rem;
      opacity: 0.1;
      pointer-events: none;
      z-index: 0;
    }

    .heart1 { top: 10%; left: 10%; animation: float 6s ease-in-out infinite; }
    .heart2 { top: 60%; right: 15%; animation: float 8s ease-in-out infinite 1s; }
    .heart3 { top: 30%; right: 10%; animation: float 7s ease-in-out infinite 2s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .card {
      background: white;
      padding: 60px 50px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(255, 77, 109, 0.2);
      position: relative;
      width: 90%;
      max-width: 420px;
      z-index: 10;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .heart-icon {
      font-size: 3rem;
      margin-bottom: 20px;
      display: inline-block;
      animation: heartbeat 1.2s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.1); }
      50% { transform: scale(1); }
    }

    .card-image {
      width: 100%;
      max-width: 300px;
      height: auto;
      border-radius: 16px;
      margin-bottom: 25px;
      box-shadow: 0 8px 20px rgba(255, 77, 109, 0.15);
      object-fit: cover;
      animation: imageZoom 0.8s ease-out;
    }

    @keyframes imageZoom {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    h1 {
      color: #ff4d6d;
      font-size: 2rem;
      margin-bottom: 10px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #888;
      font-size: 1rem;
      margin-bottom: 40px;
      font-weight: 300;
    }

    .button-container {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    button {
      padding: 14px 32px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    #yesBtn {
      background: linear-gradient(135deg, #ff4d6d 0%, #ff1744 100%);
      color: white;
      flex: 1;
      min-width: 120px;
    }

    #yesBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 77, 109, 0.4);
    }

    #yesBtn:active {
      transform: translateY(0);
    }

    #noBtn {
      background: #f0f0f0;
      color: #666;
      flex: 1;
      min-width: 120px;
      transition: all 0.2s ease;
    }

    #noBtn:hover {
      background: #e8e8e8;
      transform: scale(1.05);
    }

    #message {
      margin-top: 20px;
      font-weight: 600;
      color: #ff4d6d;
      font-size: 1.1rem;
      min-height: 30px;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .celebration {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 5;
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ff4d6d;
      opacity: 0;
    }

    @media (max-width: 480px) {
      .card {
        padding: 40px 30px;
      }

      h1 {
        font-size: 1.6rem;
      }

      button {
        padding: 12px 24px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="background-decoration heart1">❤️</div>
  <div class="background-decoration heart2">❤️</div>
  <div class="background-decoration heart3">❤️</div>

  <div class="celebration" id="celebration"></div>

  <div class="card">
    <img src="3B9644F3-8164-42C8-93B1-ABC26B61569C_1_105_c.jpeg" alt="Valentine's Image" class="card-image">
    <div class="heart-icon">❤️</div>
    <h1>Will you be my Valentine?</h1>
    <p class="subtitle">Make a choice that matters</p>

    <div class="button-container">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>

    <div id="message"></div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");
    const card = document.querySelector(".card");
    const celebration = document.getElementById("celebration");

    // Fleeing "No" button
    noBtn.addEventListener("mouseover", () => {
      const maxX = card.clientWidth - noBtn.clientWidth - 20;
      const maxY = card.clientHeight - noBtn.clientHeight - 20;

      const randomX = Math.random() * maxX + 10;
      const randomY = Math.random() * maxY + 10;

      noBtn.style.position = "absolute";
      noBtn.style.left = randomX + "px";
      noBtn.style.top = randomY + "px";
    });

    // Mobile touch support for "No" button
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      const maxX = card.clientWidth - noBtn.clientWidth - 20;
      const maxY = card.clientHeight - noBtn.clientHeight - 20;

      const randomX = Math.random() * maxX + 10;
      const randomY = Math.random() * maxY + 10;

      noBtn.style.position = "absolute";
      noBtn.style.left = randomX + "px";
      noBtn.style.top = randomY + "px";
    });

    // "Yes" button with celebration
    yesBtn.addEventListener("click", () => {
      message.textContent = "💕 You made the perfect decision! Hello Wifey! Happy Married Life 💕";
      createConfetti();
    });

    // Confetti animation
    function createConfetti() {
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.left = Math.random() * 100 + "%";
        confetti.style.background = ["#ff4d6d", "#ff1744", "#ff69b4", "#ffb6c1"][Math.floor(Math.random() * 4)];
        confetti.style.animation = `fall ${2 + Math.random() * 1}s linear forwards`;
        celebration.appendChild(confetti);

        setTimeout(() => confetti.remove(), 3000);
      }
    }

    const style = document.createElement("style");
    style.textContent = `
      @keyframes fall {
        to {
          transform: translateY(100vh) rotate(360deg);
          opacity: 0;
        }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
